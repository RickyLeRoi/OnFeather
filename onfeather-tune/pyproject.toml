[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onfeather-tune"
version = "0.0.1"
description = "Run heavy models on light hardware: automatic llama.cpp offload planning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["llm", "llama.cpp", "gguf", "moe", "offload", "inference", "local-llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # 20260726 ** RG Reference implementation the header parser is checked against.
    # Undeclared, these tests skip silently and prove nothing on a fresh checkout.
    "gguf>=0.10",
]

[project.scripts]
of = "onfeather_tune.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/onfeather_tune"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
