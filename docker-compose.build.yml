x-build: &build
  context: .
  dockerfile: Dockerfile
  args:
    SOLO_EXTRAS: ${SOLO_EXTRAS:-}

services:
  free:
    build: *build
    pull_policy: build
  solo:
    build: *build
    pull_policy: build
  tune:
    build: *build
    pull_policy: build
