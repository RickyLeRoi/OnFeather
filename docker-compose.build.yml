# Overlay that builds the image from this checkout instead of pulling it:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Set SOLO_EXTRAS=embeddings to include lancedb + sentence-transformers (~2 GB).

x-build: &build
  context: .
  dockerfile: Dockerfile
  args:
    SOLO_EXTRAS: ${SOLO_EXTRAS:-}

services:
  free:
    build: *build
    pull_policy: build
  solo:
    build: *build
    pull_policy: build
  tune:
    build: *build
    pull_policy: build
