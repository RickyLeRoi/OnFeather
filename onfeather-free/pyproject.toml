[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onfeather-free"
version = "0.0.1"
description = "Aggregate free LLM API tiers behind one quota-aware router."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "RickyLeRoi" }]
keywords = ["llm", "api", "router", "rate-limit", "groq", "gemini", "openai", "ollama"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/RickyLeRoi/onfeather-free"

[project.scripts]
of-free = "onfeather_free.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/onfeather_free"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
