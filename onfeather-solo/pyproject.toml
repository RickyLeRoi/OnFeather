[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onfeather-solo"
version = "0.0.1"
description = "A second brain whose memory you can read, correct and version."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "RickyLeRoi" }]
keywords = ["llm", "memory", "second-brain", "rag", "notes", "markdown"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["PyYAML>=6.0", "httpx>=0.27"]

[project.optional-dependencies]
embeddings = ["lancedb>=0.13", "sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/RickyLeRoi/onfeather-solo"

[project.scripts]
of-solo = "onfeather_solo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/onfeather_solo"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
