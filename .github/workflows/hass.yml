name: hass

# 20260804 ++ RG #HASS It ships as source, so hassfest and HACS stand in for "does this install".

on:
  push:
    branches: [main]
    paths: ["onfeather-hass/**", ".github/workflows/hass.yml"]
  pull_request:
    branches: [main]
    paths: ["onfeather-hass/**", ".github/workflows/hass.yml"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: hassfest
        uses: home-assistant/actions/hassfest@master
        with:
          path: ./onfeather-hass

      - name: HACS
        uses: hacs/action@main
        with:
          category: integration
          # 20260804 ++ RG #HASS The repo holds four projects; none sits at its root.
          ignore: brands

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onfeather-hass
    steps:
      - uses: actions/checkout@v4

      # 20260804 ++ RG #HASS Home Assistant 2026.7 will not install on anything older.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install pytest-homeassistant-custom-component==0.13.348 ruff

      - run: ruff check custom_components tests

      - run: python -m pytest -q
