name: hass

# 20260804 ++ RG #HASS It ships as source, so hassfest and HACS stand in for "does this install".

on:
  push:
    branches: [main]
    paths:
      - "custom_components/**"
      - "tests/**"
      - "hacs.json"
      - "requirements-test.txt"
      - ".github/workflows/hass.yml"
  pull_request:
    branches: [main]
    paths:
      - "custom_components/**"
      - "tests/**"
      - "hacs.json"
      - "requirements-test.txt"
      - ".github/workflows/hass.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 20260804 ++ RG #HASS Both actions read the repository root, and take no path.
      - name: hassfest
        uses: home-assistant/actions/hassfest@master

      - name: HACS
        uses: hacs/action@main
        with:
          category: integration
          # 20260804 ++ RG #HASS `onfeather` is not in home-assistant/brands, and will not be.
          ignore: brands

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 20260804 ++ RG #HASS Home Assistant 2026.7 will not install on anything older.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements-test.txt

      - run: ruff check custom_components tests

      - run: python -m pytest -q
