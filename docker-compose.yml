name: onfeather

# Pulls the published image from GHCR — no local build needed:
#
#   cp .env.example .env      # fill in whatever API keys you have
#   docker compose up -d      # starts the router on http://localhost:4141
#
# The other two tools are one-shot commands against the same image:
#
#   docker compose run --rm solo of-solo add "..." --type fact
#   docker compose run --rm tune of --version
#
# To build from this checkout instead of pulling:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# There is deliberately no `build:` key here — with one, Compose builds whenever
# the image is missing locally rather than pulling it, which is the opposite of
# what this file is for.

x-onfeather: &onfeather
  image: ${ONFEATHER_IMAGE:-ghcr.io/rickyleroi/onfeather}:${ONFEATHER_TAG:-latest}
  env_file:
    - path: .env
      required: false
  volumes:
    - onfeather-data:/data
  extra_hosts:
    # 20260803 ** RG Lets the container reach an Ollama running on the host, on Linux too.
    - "host.docker.internal:host-gateway"

services:
  # The OpenAI-compatible router. Point any OpenAI client at http://localhost:4141/v1.
  free:
    <<: *onfeather
    container_name: onfeather-free
    pull_policy: ${ONFEATHER_PULL_POLICY:-missing}
    command:
      - of-free
      - --registry=/opt/onfeather/share/providers-docker.yaml
      - serve
      - --host=0.0.0.0
      - --port=4141
      - --strategy=${ONFEATHER_STRATEGY:-balanced}
    ports:
      - "${ONFEATHER_PORT:-4141}:4141"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:4141/health", timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  # Second brain. Memories land in the shared volume under /data/.onfeather/solo.
  solo:
    <<: *onfeather
    profiles: ["tools"]
    command: ["of-solo", "--help"]

  # Offload planner. Mount your GGUF files into /models and pass paths from there.
  #
  # `of probe` measures the machine it runs on, which here is the container: on
  # macOS and Windows that is the Docker VM, not your hardware, and the plan it
  # produces is wrong. Probe on the host and pass the result with
  # `--profile /data/profile.json`, or run onfeather-tune natively.
  tune:
    <<: *onfeather
    profiles: ["tools"]
    command: ["of", "--version"]
    volumes:
      - onfeather-data:/data
      - ${ONFEATHER_MODELS_DIR:-./models}:/models:ro
    # 20260803 ** RG Uncomment on a Linux host with the NVIDIA Container Toolkit to let the probe see the GPU.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  onfeather-data:
