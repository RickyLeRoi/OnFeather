name: onfeather

# 20260803 ++ RG #Docker Usage is in DOCKER.md.
# 20260803 ++ RG #Docker No `build:` key on purpose: it would build instead of pulling.

x-onfeather: &onfeather
  image: ${ONFEATHER_IMAGE:-ghcr.io/rickyleroi/onfeather}:${ONFEATHER_TAG:-latest}
  env_file:
    - path: .env
      required: false
  volumes:
    - onfeather-data:/data
  extra_hosts:
    # 20260803 ++ RG #Docker Reaches an Ollama on the host, on Linux too.
    - "host.docker.internal:host-gateway"

services:
  free:
    <<: *onfeather
    container_name: onfeather-free
    pull_policy: ${ONFEATHER_PULL_POLICY:-missing}
    command:
      - of-free
      - --registry=/opt/onfeather/share/providers-docker.yaml
      - serve
      - --host=0.0.0.0
      - --port=4141
      - --strategy=${ONFEATHER_STRATEGY:-balanced}
    ports:
      - "${ONFEATHER_PORT:-4141}:4141"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:4141/health", timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  solo:
    <<: *onfeather
    profiles: ["tools"]
    command: ["of-solo", "--help"]

  # 20260803 ++ RG #Docker On macOS and Windows `of probe` measures the Docker VM, not your machine.
  tune:
    <<: *onfeather
    profiles: ["tools"]
    command: ["of", "--version"]
    volumes:
      - onfeather-data:/data
      - ${ONFEATHER_MODELS_DIR:-./models}:/models:ro
    # 20260803 ++ RG #Docker Uncomment on Linux with the NVIDIA Container Toolkit to expose the GPU.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  onfeather-data:
