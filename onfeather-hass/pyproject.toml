[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# 20260804 ** RG Home Assistant's own convention: core and custom components are first-party.
known-first-party = ["homeassistant", "custom_components", "tests"]
